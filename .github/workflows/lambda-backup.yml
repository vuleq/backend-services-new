name: Backup All Lambda Functions

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version"
        required: true
        default: "release1.0"
  push:
    branches:
      - dev
      - devops
jobs: 
  backup:
    runs-on: ubuntu-latest

    env:
      BUCKET_NAME: store-zipfiles-lambda-all
      ENV_NAME: dev  # dev/prod tùy bạn

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Install tools
        run: sudo apt-get install -y jq curl

      - name: Backup all Lambda functions
        run: |
          DATE=$(date +%d%m%Y)
          RELEASE_VERSION="${{ github.event.inputs.release_version }}"
          S3_PREFIX="$ENV_NAME/$RELEASE_VERSION/$DATE"

          echo "🔍 Lấy danh sách Lambda functions..."
          FUNCTIONS=$(aws lambda list-functions --query 'Functions[].FunctionName' --output text)

          for FUNCTION in $FUNCTIONS; do
            echo "📦 Đang xử lý $FUNCTION..."
            URL=$(aws lambda get-function --function-name "$FUNCTION" | jq -r '.Code.Location')

            # Tải về tạm thời
            curl -s -L -o "$FUNCTION.zip" "$URL"

            # Upload lên S3 với tên file là tên function
            aws s3 cp "$FUNCTION.zip" "s3://${BUCKET_NAME}/${S3_PREFIX}/${FUNCTION}.zip"

            # Xoá file tạm
            rm "$FUNCTION.zip"

            echo "✅ Đã backup: $FUNCTION → s3://${BUCKET_NAME}/${S3_PREFIX}/${FUNCTION}.zip"
          done

      - name: Done
        run: echo "🎉 Backup hoàn tất!"
