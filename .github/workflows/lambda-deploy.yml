name: Lambda Deploy

on:
  push:
    branches: [main]
    paths:
      - 'src/functions/**'
      - 'layers/**'
      - 'lambda-map.json'
      - '.github/workflows/lambda-deploy.yml'

env:
  AWS_REGION: us-east-2
  NODE_VERSION: '22'

jobs:
  deploy:
    name: Build & Deploy Lambda
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Detect changed paths
        id: changed
        run: |
          if git rev-parse HEAD~1 > /dev/null 2>&1; then
            CHANGED=$(git diff --name-only HEAD~1 HEAD)
          else
            CHANGED=$(git ls-files)
          fi

          if echo "$CHANGED" | grep -q "^layers/"; then
            echo "deploy_layers=true" >> $GITHUB_OUTPUT
          else
            echo "deploy_layers=false" >> $GITHUB_OUTPUT
          fi

          CHANGED_FUNCS=$(echo "$CHANGED" | grep "^src/functions/" | awk -F'/' '{print $1"/"$2"/"$3"/"$4}' | sort -u)
          echo "Changed functions: $CHANGED_FUNCS"
          echo "changed_funcs<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED_FUNCS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # ============================================================
      # LAYERS: Build & Publish
      # ============================================================
      - name: Build & Publish Layers
        if: steps.changed.outputs.deploy_layers == 'true'
        run: |
          for LAYER_DIR in layers/*/; do
            LAYER_NAME=$(basename $LAYER_DIR)
            AWS_LAYER_NAME="vule-${LAYER_NAME}-layer"

            mkdir -p layer-build/nodejs/${LAYER_NAME}
            npx esbuild ${LAYER_DIR}index.ts \
              --bundle --platform=node --target=node22 \
              --outfile=layer-build/nodejs/${LAYER_NAME}/index.js \
              --external:pg --external:@aws-sdk/* --log-level=warning

            cd layer-build && zip -r ../layer-${LAYER_NAME}.zip nodejs/ && cd ..
            aws lambda publish-layer-version \
              --layer-name "$AWS_LAYER_NAME" \
              --description "Layer $LAYER_NAME" \
              --zip-file fileb://layer-${LAYER_NAME}.zip \
              --compatible-runtimes nodejs22.x \
              --region ${{ env.AWS_REGION }}
            echo "Published: $AWS_LAYER_NAME"
            rm -rf layer-build layer-${LAYER_NAME}.zip
          done

          # Attach layers per-function based on lambda-map.json
          # Each function only gets the layers it needs (max 5 per Lambda)
          jq -r 'to_entries[] | .value.function_name + "|" + (.value.layers | join(","))' lambda-map.json | \
          while IFS='|' read -r FUNC_NAME LAYER_NAMES; do
            [ -z "$FUNC_NAME" ] && continue

            # Build ARN list for this function's layers
            FUNC_LAYER_ARNS=""
            IFS=',' read -ra LAYERS <<< "$LAYER_NAMES"
            for LAYER_NAME in "${LAYERS[@]}"; do
              ARN=$(aws lambda list-layer-versions \
                --layer-name "vule-${LAYER_NAME}-layer" \
                --query 'LayerVersions[0].LayerVersionArn' \
                --output text --region ${{ env.AWS_REGION }} 2>/dev/null)
              [ -n "$ARN" ] && [ "$ARN" != "None" ] && FUNC_LAYER_ARNS="$FUNC_LAYER_ARNS $ARN"
            done

            if [ -n "$FUNC_LAYER_ARNS" ]; then
              aws lambda update-function-configuration \
                --function-name "$FUNC_NAME" --layers $FUNC_LAYER_ARNS \
                --region ${{ env.AWS_REGION }} 2>/dev/null && \
                echo "Layers [${LAYER_NAMES}] attached to $FUNC_NAME" || \
                echo "Warning: $FUNC_NAME not found"
            fi
          done

      # ============================================================
      # FUNCTIONS: Build & Deploy via lambda-map.json
      # To add new lambda: just add entry to lambda-map.json
      # ============================================================
      - name: Build & Deploy changed functions
        if: steps.changed.outputs.changed_funcs != ''
        run: |
          while IFS= read -r FUNC_PATH; do
            [ -z "$FUNC_PATH" ] && continue

            # Lookup function name from new lambda-map.json structure
            FUNC_NAME=$(jq -r --arg p "$FUNC_PATH" '.[$p].function_name // ""' lambda-map.json)

            if [ -z "$FUNC_NAME" ]; then
              echo "No mapping for $FUNC_PATH - add to lambda-map.json"
              continue
            fi

            echo "Building $FUNC_PATH => $FUNC_NAME"
            mkdir -p dist/$FUNC_PATH
            npx esbuild $FUNC_PATH/index.ts \
              --bundle --platform=node --target=node22 \
              --outfile=dist/$FUNC_PATH/index.js \
              --external:@aws-sdk/* --external:'/opt/nodejs/*' \
              --log-level=warning

            cd dist/$FUNC_PATH && zip -r ../../function.zip . && cd ../..
            aws lambda update-function-code \
              --function-name "$FUNC_NAME" \
              --zip-file fileb://function.zip \
              --region ${{ env.AWS_REGION }}
            echo "Deployed: $FUNC_NAME"
            rm -f function.zip

          done <<< "${{ steps.changed.outputs.changed_funcs }}"

      - name: Summary
        run: |
          echo "## Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Target | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|--------|" >> $GITHUB_STEP_SUMMARY
          [ "${{ steps.changed.outputs.deploy_layers }}" = "true" ] && \
            echo "| Layers | Deployed |" >> $GITHUB_STEP_SUMMARY || \
            echo "| Layers | Skipped |" >> $GITHUB_STEP_SUMMARY
          [ -n "${{ steps.changed.outputs.changed_funcs }}" ] && \
            echo "| Functions | Deployed |" >> $GITHUB_STEP_SUMMARY || \
            echo "| Functions | Skipped |" >> $GITHUB_STEP_SUMMARY
