        - !Ref WdrConnectDbLayer
        - !Ref WdrErrorCodesLayer
        - !Ref WdrCommonUtilsLayer
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2020
        Sourcemap: true
        EntryPoints:
          - src/index.ts
        Tsconfig: tsconfig.sam.json
        External:
          - "wdr-connect-db"
          - "wdr-models"
          - "wdr-error-codes"
          - "wdr-common-utils"

  WdrUserLoginLogFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ResourceNamePrefix}user-login-log"
      Description: Trigger log user login to DB
      CodeUri: functions/users/wdr-user-login-log/
      Role: !GetAtt WdrLambdaRole.Arn
      Layers:
        - !Ref WdrConnectDbLayer
    
  WdrUserLoginLogGetAllFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ResourceNamePrefix}user-login-log-get-all"
      Description: Get all log user login 
      CodeUri: functions/users/wdr-user-login-log-get-all/
