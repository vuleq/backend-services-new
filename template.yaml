      Description: Count reports by range date
      CodeUri: functions/reports/wdr-count-report-by-range-date/
      Role: !GetAtt WdrLambdaRole.Arn
      Layers:
        - !Ref WdrModelsLayer
        - !Ref WdrConnectDbLayer
        - !Ref WdrErrorCodesLayer
  
  # wdr-report-create-report-template
  WdrReportCreateReportTemplateFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ResourceNamePrefix}report-create-report-template"
      Description: Create report template
      CodeUri: functions/reports/wdr-report-create-report-template/
      Role: !GetAtt WdrLambdaRole.Arn
      Layers:
        - !Ref WdrModelsLayer
        - !Ref WdrConnectDbLayer
        - !Ref WdrErrorCodesLayer
  
  # wdr-report-search-report
  WdrReportSearchReportFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ResourceNamePrefix}report-search-report"
      Description: Search reports
      CodeUri: functions/reports/wdr-report-search-report/
      Role: !GetAtt WdrLambdaRole.Arn
      Layers:
        - !Ref WdrModelsLayer
