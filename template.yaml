      Layers:
        - !Ref WdrModelsLayer
        - !Ref WdrConnectDbLayer
        - !Ref WdrErrorCodesLayer

  # --- Report Functions ---
  WdrReportGetByIdFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ResourceNamePrefix}report-get-by-id"
      Description: Get report by ID
