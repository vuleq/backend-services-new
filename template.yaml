AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  WDR Serverless Application with Lambda functions and Layers.
  This template manages the WDR microservices architecture.

Globals:
  Function:
    Runtime: nodejs22.x
    MemorySize: 128
    Timeout: 60
    Handler: index.handler
    Environment:
      Variables:
        DB_HOST: !Ref DBHost
        DB_NAME: !Ref DBName
        DB_PASSWORD: !Ref DBPassword
        DB_PORT: !Ref DBPort
        DB_USER: !Ref DBUser
        DB_IAM_USER: !Ref DBIamUser
        DB_SSL: !Ref DBSSL
        DB_SECRET_ARN: !Ref DBSecretArn
        JWT_SECRET: !Ref JWTSecret
    Tags:
      Owner: vendor
      Environment: dev
      Application: wdr
    VpcConfig:
      SecurityGroupIds: !Ref SecurityGroupIds
      SubnetIds: !Ref SubnetIds

Parameters:
  ParametersAndSecretsExtension:
    Type: String
    Description: "ARN of the AWS-Parameters-and-Secrets-Lambda-Extension"
    Default: "arn:aws:lambda:ap-southeast-1:044395824272:layer:AWS-Parameters-and-Secrets-Lambda-Extension:19"
  SAPLink:
    Type: String
    Description: "Link to SAP system for WDR project sync"
    Default: "https://devhec.kuokgroup.com.sg/RESTAdapter/WDR/"
  SAPProjectEndPoint:
    Type: String
    Description: "Endpoint for SAP project data"
    Default: "GetProject"
  SAPWBSEndPoint:
    Type: String
    Description: "Endpoint for SAP WBS data"
    Default: "GetWbs"
  SAPCreateWBSEndPoint:
    Type: String
    Description: "Endpoint for SAP Create WBS data"
    Default: "CreateWbs"
  SAPCreateWBSActivityEndPoint:
    Type: String
    Description: "Endpoint for SAP Create WBS activity data"
    Default: "CreateActivity"
  CreateReportFunctionName:
    Type: String
    Description: "Name of the Create Report Lambda Function"
    Default: "wdr-report-create-new-report-dev"
  CreateFolderFunctionName:
    Type: String
    Description: "Name of the Create Folder Lambda Function"
    Default: "wdr-bucket-create-folder"
  DeleteFolderFunctionName:
    Type: String
    Description: "Name of the Create Folder Lambda Function"
    Default: "wdr-bucket-delete-folder"
  DBHost:
    Type: String
    Description: "Database host URL"
    Default: "wdr-dev.cluster-cf4kw8i8apdx.ap-southeast-1.rds.amazonaws.com"
  DBName:
    Type: String
    Description: "Database name"
    Default: "wdr"
  DBUser:
    Type: String
    Description: "Database username for password authentication"
    Default: "postgres"
  DBIamUser:
    Type: String
    Description: "Database username for IAM authentication (must have rds_iam role)"
    Default: "iam_wdr_user"
  DBPort:
    Type: Number
    Description: "Database port"
    Default: 5432
  DBPassword:
    Type: String
    Description: "Database Password (Consider using AWS Secrets Manager)"
    NoEcho: true
    Default: ""
  DBSSL:
    Type: String
    Description: "Database SSL enabled"
    Default: "false"
  DBSecretArn:
    Type: String
    Description: "ARN of the AWS Secrets Manager secret containing database credentials (optional)"
    Default: ""
  CognitoUserPoolId:
    Type: String
    Description: "Cognito User Pool ID for user creation"
    Default: ""
  JWTSecret:
    Type: String
    Description: "JWT Secret for token generation and verification"
    NoEcho: true
    Default: "wdr-default-secret-key"
  SecurityGroupIds:
    Type: CommaDelimitedList
    Description: "List of Security Group IDs for Lambda VPC config"
    Default: "sg-0784ada3372d7f704"
  SubnetIds:
    Type: CommaDelimitedList
    Description: "List of Subnet IDs for Lambda VPC config"
    Default: "subnet-09196e984b9adaeba,subnet-0790225e217242d90,subnet-088c30a083372f428,subnet-030bf65294982e2a2"
  S3BucketName:
    Type: String
    Description: "S3 bucket name for WDR app"
    Default: "ksl-wdr-s3-dev"
  ResourceNamePrefix:
    Type: String
    Description: "Prefix for all resources created by this stack"
    Default: "wdr-"
  WdrChromeAwsLambdaLayer:
    Type: String
    Description: "ARN of the Chrome AWS Lambda Layer"
    Default: "arn:aws:lambda:ap-southeast-1:764866452798:layer:chrome-aws-lambda:50"
  SecretsManagerSecretArn:
    Type: String
    Description: "ARN of the Secrets Manager secret for database credentials"
    Default: "arn:aws:secretsmanager:ap-southeast-1:797233058645:secret:prod-wdr-maritimeapps-db-credentials-R305Nf"
  SAPSecretsManagerSecretArn:
    Type: String
    Description: "ARN of the Secrets Manager secret for SAP credentials"
    Default: "arn:aws:secretsmanager:ap-southeast-1:797233058645:secret:SAPCredentia-dAVK1r"
  FileNameTemplate:
    Type: String
    Description: "Excel file used to make export worklist template"
    Default: "masterdata/template_worklist.xlsx"
  JobSearchFunctionName:
    Type: String
    Description: "Function to get job data by filter"
    Default: "job-search-by-params"
  DefaultPwd:
    Type: String
    Description: "Default password for create new user"
    NoEcho: true
    Default: ""
  SharpLayerArn:
    Type: String
    Default: arn:aws:lambda:ap-southeast-1:797233058645:layer:sharp-lib:1
    Description: ARN of the Sharp library layer  
  # WDRLambdaRole:
  #   Type: String
  #   Description: "IAM role for Lambda functions"
  #   Default: "arn:aws:iam::797233058645:role/dev-wdr-lambda-function-role"

Resources:
  # IAM Roles , uncomment if the role is not existing
  WdrLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ResourceNamePrefix}lambda-function-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: 
                - lambda.amazonaws.com
                - scheduler.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: CognitoUserPoolAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cognito-idp:AdminCreateUser
                  - cognito-idp:AdminSetUserPassword
                  - cognito-idp:AdminUpdateUserAttributes
                  - cognito-idp:AdminGetUser
                  - cognito-idp:AdminDeleteUser
                  - cognito-idp:DescribeUserPool
                  - cognito-idp:AdminEnableUser
                  - cognito-idp:AdminDisableUser
                  - cognito-idp:AdminSetUserPassword
                Resource: !Sub "arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*"
        - PolicyName: LambdaLoggingPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"
        - PolicyName: LambdaVPCAccessExecutionPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: AWSLambdaVPCAccessExecutionPermissions
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeSubnets
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses
                Resource: "*"
        - PolicyName: S3AccessPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:DeleteObject
                  - s3:PutObject
                  - s3:ListBucket
                Resource:
                  - !Sub "arn:aws:s3:::${S3BucketName}/originals/*"
                  - !Sub "arn:aws:s3:::${S3BucketName}/compress/*"
                  - !Sub "arn:aws:s3:::${S3BucketName}/results/*"
                  - !Sub "arn:aws:s3:::${S3BucketName}/masterdata/*"
                  - !Sub "arn:aws:s3:::${S3BucketName}"
        - PolicyName: SecretsManagerAccessPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: 
                  - !Ref SecretsManagerSecretArn
                  - !Ref SAPSecretsManagerSecretArn
        - PolicyName: LambdaInvokePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: "*"
        - PolicyName: RDSAccessPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - rds-db:connect
                Resource: "*"
        - PolicyName: EventBridgeSchedulerPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - scheduler:UpdateSchedule
                Resource: "*"
              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/${ResourceNamePrefix}lambda-function-role"

  # Lambda Layers
  WdrErrorCodesLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub "${ResourceNamePrefix}error-codes-layer"
      Description: WDR Error code definitions
      ContentUri: layers/wdr-error-codes/nodejs/
      CompatibleRuntimes:
        - nodejs22.x
      RetentionPolicy: Retain
    Metadata:
      BuildMethod: nodejs22.x

  WdrConnectDbLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub "${ResourceNamePrefix}connect-db-layer"
      Description: WDR Database connection utilities
      ContentUri: layers/wdr-connect-db/nodejs/
      CompatibleRuntimes:
        - nodejs22.x
      RetentionPolicy: Retain
    Metadata:
      BuildMethod: nodejs22.x

  WdrModelsLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub "${ResourceNamePrefix}models-layer"
      Description: WDR API Models
      ContentUri: layers/wdr-models/nodejs/
      CompatibleRuntimes:
        - nodejs22.x
      RetentionPolicy: Retain
    Metadata:
      BuildMethod: nodejs22.x

  WdrPdfUtilsLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub "${ResourceNamePrefix}pdf-utils-layer"
      Description: WDR PDF generation and XML parsing utilities
      ContentUri: layers/wdr-pdf-utils/nodejs/
      CompatibleRuntimes:
        - nodejs22.x
      RetentionPolicy: Retain
    Metadata:
      BuildMethod: nodejs22.x

  WdrCommonUtilsLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub "${ResourceNamePrefix}common-utils-layer"
      Description: WDR Common utilities with UUID and JWT token functions
      ContentUri: layers/wdr-common-utils/nodejs/
      CompatibleRuntimes:
        - nodejs22.x
      RetentionPolicy: Retain
    Metadata:
      BuildMethod: nodejs22.x

  WdrConnectExternalLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub "${ResourceNamePrefix}connect-external-layer"
      Description: WDR External API connection utilities for SAP and other services
      ContentUri: layers/wdr-connect-external/nodejs/
      CompatibleRuntimes:
        - nodejs22.x
      RetentionPolicy: Retain
    Metadata:
      BuildMethod: nodejs22.x

  WdrExcelJsLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub "${ResourceNamePrefix}exceljs-layer"
      Description: ExcelJS library for Excel file operations
      ContentUri: layers/wdr-exceljs-layer/nodejs/
      CompatibleRuntimes:
        - nodejs22.x
      RetentionPolicy: Retain
    Metadata:
      BuildMethod: nodejs22.x

  # Lambda Functions

  # --- User Functions ---
  # wdr user find by role function
  WdrUserFindByRoleFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ResourceNamePrefix}user-find-by-role"
      Description: Find users by role
      CodeUri: functions/users/wdr-user-find-by-role/
      Role: !GetAtt WdrLambdaRole.Arn
      Layers:
        - !Ref WdrModelsLayer
        - !Ref WdrConnectDbLayer
        - !Ref WdrErrorCodesLayer
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2020
        Sourcemap: true
        EntryPoints:
          - src/index.ts
        Tsconfig: tsconfig.sam.json
        External:
          - "wdr-connect-db"
          - "wdr-models"
          - "wdr-error-codes"

  # wdr create users
  WdrCreateUsersFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ResourceNamePrefix}create-users-dev"
      Description: Function to create users in Cognito and database
      CodeUri: functions/users/wdr-create-users/
      Role: !GetAtt WdrLambdaRole.Arn
      Layers:
        - !Ref WdrModelsLayer
        - !Ref WdrConnectDbLayer
        - !Ref WdrErrorCodesLayer
        - !Ref WdrCommonUtilsLayer
      Environment:
        Variables:
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
          DEFAULT_PASSWORD: !Ref DefaultPwd
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2020
        Sourcemap: true
        EntryPoints:
          - src/index.ts
        Tsconfig: tsconfig.sam.json
        External:
          - "wdr-connect-db"
          - "wdr-models"
          - "wdr-error-codes"
          - "wdr-common-utils"
          - "@aws-sdk/client-cognito-identity-provider"

  # wdr update users
  WdrUpdateUsersFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: wdr-update-users-dev
      Description: Function to update user in Cognito and database
      CodeUri: functions/users/wdr-update-users/
      Role: !GetAtt WdrLambdaRole.Arn
      Layers:
        - !Ref WdrModelsLayer
        - !Ref WdrConnectDbLayer
        - !Ref WdrErrorCodesLayer
        - !Ref WdrCommonUtilsLayer
      Environment:
        Variables:
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2020
        Sourcemap: true
        EntryPoints:
          - src/index.ts
        Tsconfig: tsconfig.sam.json
        External:
          - "wdr-connect-db"
          - "wdr-models"
          - "wdr-error-codes"
          - "wdr-common-utils"
          - "@aws-sdk/client-cognito-identity-provider"

    #  wdr user search function
  WdrUserSearchFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ResourceNamePrefix}user-search"
      Description: Search users
      CodeUri: functions/users/wdr-user-search-user/
      Role: !GetAtt WdrLambdaRole.Arn
      Layers:
        - !Ref WdrModelsLayer
        - !Ref WdrConnectDbLayer
        - !Ref WdrErrorCodesLayer

  # wdr toggle user status
  WdrToggleUserStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: wdr-toggle-user-status-dev
      Description: Toggle user status in Cognito and database
      CodeUri: functions/users/wdr-toggle-user-status/
      Role: !GetAtt WdrLambdaRole.Arn
      Layers:
        - !Ref WdrModelsLayer
        - !Ref WdrConnectDbLayer
        - !Ref WdrErrorCodesLayer
        - !Ref WdrCommonUtilsLayer
      Environment:
        Variables:
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2020
        Sourcemap: true
        EntryPoints:
          - src/index.ts
        Tsconfig: tsconfig.sam.json
        External:
          - "wdr-connect-db"
          - "wdr-common-utils"
          - "wdr-models"
          - "wdr-error-codes"
          - "@aws-sdk/client-cognito-identity-provider"

  # wdr-users-get-all
  WdrUsersGetAllFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ResourceNamePrefix}users-get-all-dev"
      Description: Function to get all users by filter
      CodeUri: functions/users/wdr-users-get-all/
