        - !Ref WdrConnectDbLayer
        - !Ref WdrErrorCodesLayer
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2020
        Sourcemap: true
        EntryPoints:
          - src/index.ts
        Tsconfig: tsconfig.sam.json
        External:
          - "wdr-connect-db"
          - "wdr-models"
          - "wdr-error-codes"

  # wdr-user-get-my-role
  WdrUsersGetMyRoleFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ResourceNamePrefix}user-get-my-role-dev"
      Description: Function to get role and permission by user id from token
      CodeUri: functions/users/wdr-user-get-my-role/
