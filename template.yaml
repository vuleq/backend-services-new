      CodeUri: functions/projects/wdr-project-daily-fetch/
      Role: !GetAtt WdrLambdaRole.Arn
      Timeout: 300
      Environment:
        Variables:
          SAP_LINK: !Ref SAPLink
          SAP_PROJECT: !Ref SAPProjectEndPoint
          SAP_SECRET_NAME: !Ref SAPSecretsManagerSecretArn
      Layers:
        - !Ref WdrConnectDbLayer
        - !Ref WdrConnectExternalLayer
        - !Ref ParametersAndSecretsExtension
      Events:
        DailySchedule:
          Type: ScheduleV2
          Properties:
            Name: !Sub "${ResourceNamePrefix}project-daily-fetch-schedule"
            ScheduleExpression: "cron(0 10 * * ? *)"
            ScheduleExpressionTimezone: "Asia/Singapore"
            Description: "Run daily project fetch at 6 AM Singapore time"
            State: ENABLED
            RoleArn: !GetAtt WdrLambdaRole.Arn
    Metadata:
